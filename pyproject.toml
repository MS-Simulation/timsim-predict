[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timsim-predict"
version = "0.1.0"
description = "timsim v2 prediction CLI jobs (CCS, RT, MS2 fragment intensity) — parquet I/O over the pepdl predictors. The pipeline's prediction step, free of imspy dead weight."
requires-python = ">=3.11"
license = { text = "MIT" }
# scipy: rt.py draws the elution-peak shape parameters with scipy.stats.beta. It arrives
# transitively via pepdl today, but this package uses it directly, so it is declared directly.
dependencies = ["pepdl @ git+https://github.com/MS-Simulation/pepdl.git@75420c5cbc878130ea7034a1b6e32eb23a73fc25", "numpy>=1.21", "pandas>=1.3", "pyarrow>=13", "scipy>=1.7"]

[project.optional-dependencies]
local = ["pepdl[local]"]
koina = ["pepdl[koina]"]
dev = ["pytest>=8.0"]

[project.scripts]
timsim-ccs = "timsim_predict.ccs:main"
timsim-rt = "timsim_predict.rt:main"
timsim-fragments = "timsim_predict.fragments:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/timsim_predict"]
